<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241336"/><stop offset=".52" stop-color="#7e3a7f"/><stop offset="1" stop-color="#f2a84d"/></linearGradient>
  <linearGradient id="island" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#394b68"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72d6a1"/><stop offset="1" stop-color="#6fd4c0"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff7cc" stop-opacity=".96"/><stop offset=".35" stop-color="#ffd889" stop-opacity=".48"/><stop offset="1" stop-color="#ffd889" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="760" fill="url(#sky)"/>
<circle cx="1320" cy="125" r="255" fill="url(#sun)"/>
<g fill="#fff" opacity=".11" filter="url(#blur)"><ellipse cx="210" cy="110" rx="200" ry="64"/><ellipse cx="700" cy="120" rx="240" ry="72"/><ellipse cx="1210" cy="255" rx="260" ry="75"/></g>
<!-- distant islands -->
<g opacity=".63" filter="url(#shadow)">
  <g transform="translate(170 220) scale(.7)"><path d="M0 80 q100-74 200 0 l-47 118 q-52 88-106 0z" fill="url(#island)"/><ellipse cx="100" cy="80" rx="100" ry="32" fill="url(#grass)"/></g>
  <g transform="translate(500 120) scale(.55)"><path d="M0 80 q100-74 200 0 l-47 118 q-52 88-106 0z" fill="url(#island)"/><ellipse cx="100" cy="80" rx="100" ry="32" fill="url(#grass)"/></g>
  <g transform="translate(840 170) scale(.62)"><path d="M0 80 q100-74 200 0 l-47 118 q-52 88-106 0z" fill="url(#island)"/><ellipse cx="100" cy="80" rx="100" ry="32" fill="url(#grass)"/></g>
  <g transform="translate(1330 260) scale(.54)"><path d="M0 80 q100-74 200 0 l-47 118 q-52 88-106 0z" fill="url(#island)"/><ellipse cx="100" cy="80" rx="100" ry="32" fill="url(#grass)"/></g>
</g>
<!-- main SKYLAND -->
<g transform="translate(505 320)" filter="url(#shadow)">
  <path d="M0 90 q210-125 425 0 l-85 190 q-112 120-232 0z" fill="url(#island)"/>
  <ellipse cx="210" cy="92" rx="214" ry="66" fill="url(#grass)"/>
  <path d="M55 88 q155-70 310 0" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="10"/>
  <path d="M108 60 h32 v-72 h38 v72 h42 v-98 h40 v98 h38 v-58 h38 v58" fill="#f3e4c2" opacity=".86"/>
  <path d="M78 115 q132 54 258 0" fill="none" stroke="#a9ecff" stroke-width="7" opacity=".55"/>
</g>
<!-- clouds foreground -->
<path d="M0 620 C170 565 290 610 440 596 C600 580 690 626 840 600 C1010 570 1130 620 1280 595 C1400 575 1515 590 1600 565 V760 H0Z" fill="#edf5ff" opacity=".88"/>
<path d="M0 676 C210 625 325 682 520 655 C735 625 890 675 1085 647 C1270 620 1430 660 1600 636 V760 H0Z" fill="#ffffff" opacity=".68"/>
<!-- chapter motif -->
<g transform="translate(1040 240)"><path d="M0 175 h355 v38 H0z" fill="#111b38" fill-opacity=".72"/><path d="M35 175 v-95 h285 v95" fill="#2e1c4a" fill-opacity=".56" stroke="#fff" stroke-opacity=".45" stroke-width="5"/><circle cx="178" cy="95" r="52" fill="#ffd66b" fill-opacity=".20" stroke="#ffd66b" stroke-width="7"/><path d="M160 95 l14 18 30-38" fill="none" stroke="#ffd66b" stroke-width="10" stroke-linecap="round"/><circle cx="70" cy="205" r="10" fill="#fff" opacity=".75"/><circle cx="120" cy="205" r="10" fill="#fff" opacity=".75"/><circle cx="235" cy="205" r="10" fill="#fff" opacity=".75"/><circle cx="285" cy="205" r="10" fill="#fff" opacity=".75"/></g>
<path d="M105 535 h290" stroke="#ffd66b" stroke-width="7" opacity=".75"/>
