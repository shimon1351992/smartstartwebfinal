<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#042f2e" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#083344" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" floodColor="#000" floodOpacity="0.5" />
    </filter>
  </defs>

  {/* Background */}
  <rect width="800" height="500" fill="url(#bgGrad)" />

  {/* Decorative Tech Grid */}
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  {/* Smart Hub 3D Stylized */}
  <g transform="translate(180, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
    {/* Green Button */}
    <circle cx="110" cy="50" r="24" fill="#10b981" stroke="#059669" stroke-width="4" />
    <polygon points="104,38 122,50 104,62" fill="#ffffff" />
    {/* Studs */}
    <ellipse cx="40" cy="10" rx="14" ry="7" fill="#cbd5e1" />
    <ellipse cx="85" cy="10" rx="14" ry="7" fill="#cbd5e1" />
    <ellipse cx="135" cy="10" rx="14" ry="7" fill="#cbd5e1" />
    <ellipse cx="180" cy="10" rx="14" ry="7" fill="#cbd5e1" />
  </g>

  {/* Gear Wheel 3D */}
  <g transform="translate(480, 200)" filter="url(#shadow)">
    <circle cx="60" cy="60" r="55" fill="#facc15" stroke="#ca8a04" stroke-width="4" />
    <circle cx="60" cy="60" r="22" fill="#0f172a" />
    {/* Teeth */}
    <rect x="52" y="-5" width="16" height="20" rx="3" fill="#ca8a04" />
    <rect x="52" y="105" width="16" height="20" rx="3" fill="#ca8a04" />
    <rect x="-5" y="52" width="20" height="16" rx="3" fill="#ca8a04" />
    <rect x="105" y="52" width="20" height="16" rx="3" fill="#ca8a04" />
  </g>

  {/* Title & Badge */}
  <text x="400" y="370" fill="url(#glowGrad)" font-family="Rubik, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="1">
    LEGO EDUCATION WeDo 2.0
  </text>
  <text x="400" y="415" fill="#94a3b8" font-family="Rubik, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    ערכת ליבה 45300 • רובוטיקה, מכניקה ותכנות חכם
  </text>
</svg>
