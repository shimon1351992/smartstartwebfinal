[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"

[[redirects]]
  from = "/api/*"
  to = "https://small-robot.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/compile/*"
  to = "https://small-robot.onrender.com/compile/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/upload/*"
  to = "https://small-robot.onrender.com/upload/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ports"
  to = "https://small-robot.onrender.com/ports"
  status = 200
  force = true

[[redirects]]
  from = "/send-code-email"
  to = "https://small-robot.onrender.com/send-code-email"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
